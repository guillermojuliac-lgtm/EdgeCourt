; Configuración de dev-environment para este proyecto. Se versiona en git.
; Los CLAUDE.md / AGENTS.md y .claude/ se generan desde aquí:
;   ./dev-env.sh project sync <ruta-del-proyecto>
; Los resultados de las comprobaciones no se guardan aquí ni en los archivos de los agentes.

[project]
types = python,infra
tools = claude,codex

; Validación de la raíz (o del proyecto entero si no tiene subcarpetas).
; Claves libres; habituales: environment, build, lint, typecheck, test, slow, baseline.
; slow = subconjunto diario de pruebas lentas (lo ejecuta /validar-todo).
; slow_full = suite completa (opcional; /validar-todo NO la ejecuta, se lanza a mano).
; Las claves que acaben en _cmd, compose y slow_full se muestran como comando.
; Rellénalas con /configurar-validacion (Claude) o $configurar-validacion (Codex).
[validation]
environment = local (uv; no hay Dockerfile ni compose en el repositorio)
lint = uv run ruff check . && uv run ruff format --check .
test = uv run pytest
critical = uv run pytest -m critical
; Sin build ni typecheck: no hay comando definido en el proyecto (pyproject solo usa hatchling para empaquetar).
; Sin slow: los tests de integración necesitan EDGECOURT_TEST_DSN apuntando a una base de pruebas (nunca la operativa).

; Validación por subcarpeta de un monorepo, por ejemplo:
; [validation:backend]
; build = dotnet build
; test = dotnet test

; Documentos versionados con el contexto propio del proyecto (arquitectura, convenciones).
; Una entrada por carpeta (root = raíz): se enlazan desde los CLAUDE.md / AGENTS.md generados.
; [notes]
; root = docs/agents/proyecto.md
